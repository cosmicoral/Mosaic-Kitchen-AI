<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AI meal planning for multicultural households in the UK. Plan around what is already in your kitchen, cut waste, and keep cooking the food you grew up with."
    />

    <!-- Three crops of the one illustration, because no single crop works at
         both 16px and 512px. The tab-sized icons are cropped to the glasses and
         eyes; below about 48px the jungle background and the hoodie are a few
         pixels of noise each and swallow the face. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />

    <!-- iOS ignores the manifest icons and the alpha channel, so this one is
         flattened onto the brand cream rather than left transparent. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#9acd22" />

    <title>Mosaic Kitchen AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
